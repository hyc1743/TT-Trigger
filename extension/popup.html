<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT Trigger</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="mark" aria-hidden="true">TT</div>
      <div>
        <h1>Trigger</h1>
        <p>taoli.tools 页面触发器</p>
      </div>
    </header>

    <section class="status-panel" aria-live="polite">
      <div class="status-line">
        <span id="status-indicator" class="indicator"></span>
        <strong id="status-label">正在读取状态</strong>
      </div>
      <p id="status-message">请稍候</p>
    </section>

    <form id="token-form" class="token-panel" novalidate>
      <label for="token">Token</label>
      <div class="token-row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" minlength="32" required>
        <button id="toggle-token" type="button">显示</button>
      </div>
      <div class="save-row">
        <p id="save-status" role="status"></p>
        <button type="submit" class="primary">保存并连接</button>
      </div>
    </form>

    <dl>
      <div>
        <dt>本机服务</dt>
        <dd id="relay-url">—</dd>
      </div>
      <div>
        <dt>目标页面</dt>
        <dd>https://taoli.tools/*</dd>
      </div>
    </dl>

    <button id="reconnect" class="reconnect" type="button">重新连接</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
