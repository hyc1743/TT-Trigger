<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT Trigger</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><div class="mark" aria-hidden="true">TT</div><div><h1>Trigger</h1><p>taoli.tools 页面触发器</p></div></header>
    <section class="status-panel" aria-live="polite">
      <div class="status-line"><span id="status-indicator" class="indicator"></span><strong id="status-label">正在读取状态</strong></div>
      <p id="status-message">请稍候</p>
    </section>

    <div class="mode-tabs" role="group" aria-label="连接模式">
      <button id="mode-local" type="button">本地 / Tailscale</button>
      <button id="mode-cloud" type="button">云端 E2EE</button>
    </div>

    <form id="local-form" class="panel" novalidate>
      <label for="token">插件连接 Token</label>
      <div class="input-action"><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="toggle-token" type="button">显示</button></div>
      <div class="action-row"><p class="form-status" id="local-status"></p><button type="submit" class="primary">保存并连接</button></div>
    </form>

    <section id="cloud-panel" class="panel" hidden>
      <form id="cloud-register-form" novalidate>
        <label for="cloud-relay">Cloudflare 中继地址</label>
        <input id="cloud-relay" type="url" placeholder="https://tt-trigger.jwyhyc.workers.dev" autocomplete="off" spellcheck="false">
        <label for="activation-code">激活码 <span>自部署首次注册可留空</span></label>
        <input id="activation-code" type="password" autocomplete="off" spellcheck="false">
        <div class="action-row"><p class="form-status" id="cloud-status"></p><button type="submit" class="primary">注册并连接</button></div>
      </form>
      <div id="cloud-device" hidden>
        <dl><div><dt>设备 ID</dt><dd id="device-id">—</dd></div></dl>
        <div class="backup-actions"><button id="export-device" type="button">导出加密设备备份</button><button id="import-device" type="button">导入设备备份</button></div>
        <input id="backup-file" type="file" accept="application/json,.json" hidden>
        <form id="client-form" class="client-form">
          <label for="client-name">新增调用方</label>
          <div class="input-action"><input id="client-name" maxlength="40" placeholder="例如：交易机器人"><button type="submit" class="primary">新增并导出</button></div>
          <label class="check-row" for="client-add-pair"><input id="client-add-pair" type="checkbox"> 允许点击 Add Pair</label>
        </form>
        <div id="client-list" class="client-list"></div>
      </div>
    </section>

    <dl class="meta"><div><dt>当前中继</dt><dd id="relay-url">—</dd></div><div><dt>目标页面</dt><dd>https://taoli.tools/*</dd></div></dl>
    <button id="reconnect" class="reconnect" type="button">重新连接</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
