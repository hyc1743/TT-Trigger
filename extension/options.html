<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TT Trigger 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header>
      <span class="index">01</span>
      <div>
        <h1>TT Trigger</h1>
        <p>连接 Windows 本机 Webhook 服务</p>
      </div>
    </header>

    <form id="settings-form" novalidate>
      <section>
        <label for="relay-url">WebSocket 地址</label>
        <input id="relay-url" name="relayUrl" type="url" spellcheck="false" autocomplete="off" required>
        <p class="hint">默认地址：ws://127.0.0.1:8787/extension</p>
      </section>

      <section>
        <label for="token">Token</label>
        <div class="token-row">
          <input id="token" name="token" type="password" spellcheck="false" autocomplete="off" minlength="32" required>
          <button id="toggle-token" type="button">显示</button>
        </div>
        <p class="hint">复制 start.bat 首次启动时生成的 Token。</p>
      </section>

      <footer>
        <p id="form-status" role="status"></p>
        <button type="submit" class="primary">保存并连接</button>
      </footer>
    </form>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
