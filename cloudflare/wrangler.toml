name = "tt-trigger-relay"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[vars]
ENROLLMENT_MODE = "activation_required"
ALLOW_LEGACY_WS_AUTH = "true"
REQUEST_TIMEOUT_MS = "10000"
RATE_LIMIT_PER_MINUTE = "60"
RATE_LIMIT_BURST = "10"
DEVICE_RATE_LIMIT_PER_MINUTE = "240"
DEVICE_RATE_LIMIT_BURST = "40"
MAX_CLIENTS_PER_DEVICE = "20"

[[durable_objects.bindings]]
name = "ENROLLMENT_REGISTRY"
class_name = "EnrollmentRegistry"

[[durable_objects.bindings]]
name = "DEVICE_RELAY"
class_name = "DeviceRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EnrollmentRegistry", "DeviceRelay"]

[observability]
enabled = true
head_sampling_rate = 0
